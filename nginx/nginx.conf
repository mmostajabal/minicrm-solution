events {
    worker_connections 1024;
}

http {

    # Rate limiting — max 60 requests/minute per IP (matches miniCRM API limit)
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    # Access log format
    log_format main '$remote_addr - $remote_method $request_uri $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    upstream minicrm_gateway {
        server gateway:5080;
    }

    server {
        listen 80;
        server_name localhost;

        # Apply rate limiting
        limit_req zone=api burst=20 nodelay;

        # Health check endpoint (no auth required)
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Forward all traffic to the API Gateway
        location / {
            proxy_pass         http://minicrm_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }
    }
}
